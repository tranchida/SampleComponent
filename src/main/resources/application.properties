
# to configure camel main
# https://camel.apache.org/components/next/others/main.html
camel.main.name = MyTimerCamel

myPeriod = 3000
hi = Hello
bye = Goodbye

# ActiveMQ Classic connection
activemq.broker-url = tcp://localhost:61616
activemq.username = admin
activemq.password = admin

activemq.queue = MyQueue

# SFTP XML+PDF pair route
# NOTE: Replace sftp.password with an environment variable or secrets manager in production.
sftp.host = localhost
sftp.port = 22
sftp.directory = upload
sftp.username = sftpuser
sftp.password = sftppass
sftp.poll.delay = 5000

# Camel Server
camel.server.enabled=true
camel.server.port=8080

# management configuration
camel.management.enabled = true
camel.management.port=8081
camel.management.jolokiaEnabled = true
